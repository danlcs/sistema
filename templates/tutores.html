<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Tutores</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a href="{{ url_for('dashboard') }}" class="navbar-brand">← Painel</a>
        <span class="text-light">Usuário: <strong>{{ session['user_nome'] }}</strong></span>
        <a href="{{ url_for('logout') }}" class="btn btn-sm btn-danger">Sair</a>
    </nav>
    <div class="container mt-4">
        <h2>Módulo de Tutores</h2>
        
        
        <form method="GET" class="row g-2 my-3">
            <div class="col-auto">
                <input type="text" name="busca" class="form-control" placeholder="Buscar tutor por nome..." value="{{ busca }}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-secondary">Buscar</button>
            </div>
        </form>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Hash do CPF (Protegido)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for tutor in tutores %}
                <tr>
                    <td>{{ tutor.id }}</td>
                    <td>{{ tutor.nome }}</td>
                    <td class="text-truncate" style="max-width: 150px;">{{ tutor.cpf_criptografado }}</td>
                    <td>
                        
                        <form action="{{ url_for('editar_tutor', id=tutor.id) }}" method="POST" class="d-inline row g-1">
                            <div class="col-auto"><input type="text" name="nome" placeholder="Novo nome" class="form-control form-control-sm"></div>
                            <div class="col-auto"><input type="text" name="cpf" placeholder="Novo CPF" class="form-control form-control-sm"></div>
                            <div class="col-auto"><button type="submit" class="btn btn-sm btn-warning">Salvar</button></div>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
